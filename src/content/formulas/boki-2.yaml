exam: boki-2
title: 日商簿記2級 公式集
intro: '日商簿記2級でよく使う計算式を、商業簿記と工業簿記の論点ごとにまとめました。2027年度から適用される出題区分表に合わせ、リースは企業会計基準第34号にもとづく使用権資産・リース負債の処理で示しています。原価差異は「標準（予定）− 実際」で計算し、プラスを有利差異（貸方差異）、マイナスを不利差異（借方差異）とします。'
updatedAt: '2026-11-26'
sections:
  - title: 商品売買・債権と外貨建取引
    topics: [merchandise-revenue, provisions, receivables-fx]
    items:
      - name: 売上原価
        tex: '\text{売上原価} = \text{期首商品棚卸高} + \text{当期商品仕入高} - \text{期末商品棚卸高}'
        note: '3分法の決算整理で、仕入勘定を使って計算する基本形です。期末商品棚卸高には**帳簿棚卸高**（原価 × 帳簿数量）を使い、棚卸減耗損と商品評価損は別に計算します。これらを売上原価に含めるか（仕入勘定に振り替えるか）は、問題文の指示に従います。'
        term: cost-of-goods-sold
      - name: 棚卸減耗損と商品評価損
        tex: '\begin{aligned}\text{棚卸減耗損} &= \text{原価} \times (\text{帳簿数量} - \text{実地数量}) \\ \text{商品評価損} &= (\text{原価} - \text{正味売却価額}) \times \text{実地数量}\end{aligned}'
        note: '先に数量の減少（減耗）を原価で計算し、残った**実地数量**に単価の下落分を掛けます。評価損に帳簿数量を掛けると、減耗した分まで二重に計算してしまいます。正味売却価額が原価を上回るときは、評価損も評価益も計上しません。'
      - name: 貸倒引当金の繰入額（差額補充法）
        tex: '\text{繰入額} = \text{期末債権残高} \times \text{設定率} - \text{貸倒引当金の残高}'
        note: '結果がマイナスなら、その分を貸倒引当金戻入（収益）とします。期中に前期以前の債権が貸し倒れて引当金を取り崩していれば、取崩し後の残高を差し引きます。個別に評価する債権は（債権額 − 担保などによる回収見込額）× 設定率で別に計算し、一括評価の対象から除きます。営業債権の繰入額は販売費及び一般管理費、貸付金など営業外の債権の繰入額は営業外費用です。'
        term: allowance-for-doubtful-accounts
      - name: 決算時の換算と為替差損益
        tex: '\text{為替差損益} = \text{外貨額} \times (\text{決算時の為替相場} - \text{帳簿上の為替相場})'
        note: '決算時に換算替えするのは、外貨建ての**貨幣項目**（現金・売掛金・買掛金・借入金など）だけです。前払金・前受金や商品・固定資産は、取引時の相場のまま換算替えしません。式の値がプラスなら、資産では為替差益ですが、負債（買掛金など）では為替差損になります。'
      - name: 為替予約（振当処理）
        tex: '\text{為替差損益} = \text{外貨額} \times (\text{予約レート} - \text{取引日の直物レート})'
        note: '取引が発生した後に為替予約を付したときは、外貨建ての債権債務を予約レートで換算し直し、差額をその期の為替差損益とします（式は債権の場合で、債務では符号が逆）。取引の前（または同時）に予約したときは、取引そのものを予約レートで記帳するので差額は生じません。予約を付した債権債務は、決算時に換算替えしません。差額を直直差額と直先差額に分けて期間配分するのは1級の範囲です。'

  - title: 固定資産とリース
    topics: [fixed-assets, lease]
    items:
      - name: 定額法
        tex: '\text{減価償却費} = \frac{\text{取得原価} - \text{残存価額}}{\text{耐用年数}} \times \frac{\text{当期の使用月数}}{12}'
        note: '期中に取得・売却した資産は月割りで計算します。残存価額は問題文の指示（ゼロ、取得原価の10％など）に従います。取得原価には購入代価のほか、引取運賃・据付費・試運転費などの付随費用を含めます。'
        term: depreciation
      - name: 定率法
        tex: '\text{減価償却費} = (\text{取得原価} - \text{減価償却累計額}) \times \text{償却率}'
        note: '償却率を掛けるのは取得原価ではなく、**期首の帳簿価額**です。取得原価に掛けると毎年同じ額になり、定率法になりません。期中に取得した年度は、この額をさらに月割りします。'
      - name: 200％定率法
        tex: '\begin{aligned}\text{償却率} &= \frac{1}{\text{耐用年数}} \times 2 \\ \text{減価償却費} &= \begin{cases} \text{期首帳簿価額} \times \text{償却率} & (\text{調整前償却額} \geq \text{償却保証額}) \\ \text{改定取得原価} \times \text{改定償却率} & (\text{調整前償却額} < \text{償却保証額}) \end{cases}\end{aligned}'
        note: '調整前償却額は「期首帳簿価額 × 償却率」、償却保証額は「取得原価 × 保証率」です。調整前償却額が償却保証額を下回った年度から、その年度の期首帳簿価額（改定取得原価）に改定償却率を掛けた均等額に切り替えます。例：取得原価 1,000,000円・耐用年数5年（償却率 0.4、保証率 0.108、改定償却率 0.5）では、4年目の調整前償却額 86,400円 が償却保証額 108,000円 を下回るので、4年目以降は 216,000 × 0.5 ＝ 108,000円 です。'
      - name: 生産高比例法
        tex: '\text{減価償却費} = (\text{取得原価} - \text{残存価額}) \times \frac{\text{当期の利用量}}{\text{総利用可能量}}'
        note: '車両（走行距離）や鉱業用設備など、総利用量を見積もれる資産に使います。利用量で配分するので**月割りはしません**。残存価額を差し引き忘れやすい方法です。'
      - name: リース負債と支払利息（利子抜き法）
        tex: '\begin{aligned}\text{リース負債の当初計上額} &= \text{リース料総額} - \text{利息相当額} \\ \text{毎期の支払利息} &= \text{利息相当額} \times \frac{\text{当期の月数}}{\text{リース期間の月数}}\end{aligned}'
        note: '利子抜き法では、利息相当額をリース期間にわたって定額法で配分し、リース料の支払額から支払利息を除いた部分だけリース負債を減らします。利子込み法では、使用権資産とリース負債をリース料総額で計上し、支払利息を計上しません。短期リース（12か月以内で購入オプションなし）と少額リースは、支払リース料による賃貸借処理が認められます。'
        term: lease-accounting
      - name: 使用権資産の減価償却
        tex: '\text{減価償却費} = \frac{\text{使用権資産の取得原価}}{\text{リース期間}} \times \frac{\text{当期の使用月数}}{12}\quad (\text{残存価額ゼロ})'
        note: '原資産の所有権が借手に移転しないリースでは、耐用年数をリース期間、残存価額をゼロとします（所有権が移転するリースでは、自己所有の資産と同じ経済的耐用年数を使います）。利子込み法ではリース料総額が取得原価になるので、利子抜き法より減価償却費が大きくなります。'

  - title: 有価証券
    topics: [securities]
    items:
      - name: 売買目的有価証券の評価
        tex: '\text{有価証券評価損益} = \text{期末の時価} - \text{帳簿価額}'
        note: '評価差額は当期の損益（営業外損益）です。翌期首に振り戻す洗替法と、振り戻さない切放法があり、問題文の指示に従います。同じ銘柄を複数回に分けて取得したときは、平均原価法で1株（1口）当たりの帳簿価額を求めます。'
        term: securities-classification
      - name: 償却原価法（定額法）
        tex: '\text{当期の償却額} = (\text{額面金額} - \text{取得価額}) \times \frac{\text{当期の保有月数}}{\text{取得日から償還日までの月数}}'
        note: '満期保有目的債券を額面と異なる価額で取得し、その差額が金利の調整と認められる場合に、帳簿価額を毎期少しずつ額面に近づけます。償却額は有価証券利息で処理し、取得価額が額面より低ければ帳簿価額に加え、高ければ減らします。分母は発行から償還までではなく、**取得**から償還までの期間です。2級は定額法のみで、利息法は1級の範囲です。'
      - name: その他有価証券の評価（全部純資産直入法）
        tex: '\text{その他有価証券評価差額金} = (\text{期末の時価} - \text{取得原価}) \times (1 - \text{法定実効税率})'
        note: '評価差額は損益にせず、純資産の部に計上します。税効果会計を適用するときは、評価差額に税率を掛けた額を繰延税金負債（評価差益のとき）または繰延税金資産（評価差損のとき）とし、残りを評価差額金とします。この税効果は法人税等調整額を**通しません**。翌期首には洗替法で取得原価に戻します。'

  - title: 税効果会計と純資産
    topics: [tax-effect, equity]
    items:
      - name: 繰延税金資産・繰延税金負債
        tex: '\text{繰延税金資産（負債）} = \text{一時差異} \times \text{法定実効税率}'
        note: '将来減算一時差異（貸倒引当金・減価償却費の損金算入限度超過額、その他有価証券の評価差損）からは繰延税金資産が、将来加算一時差異（その他有価証券の評価差益）からは繰延税金負債が生じます。交際費の損金不算入額のような永久差異には税効果を適用しません。'
        term: tax-effect-accounting
      - name: 法人税等調整額
        tex: '\text{法人税等調整額（貸方）} = (\text{期末の将来減算一時差異} - \text{期首の将来減算一時差異}) \times \text{法定実効税率}'
        note: '一時差異が増えれば（借）繰延税金資産（貸）法人税等調整額、減れば逆の仕訳です。損益計算書では「法人税、住民税及び事業税」から貸方の法人税等調整額を差し引いて（借方なら加えて）当期純利益を求めます。その他有価証券の評価差額に係る税効果は純資産で処理するので、この計算に含めません。'
      - name: 利益準備金の積立額
        tex: '\text{積立額} = \min\left(\text{配当額} \times \frac{1}{10},\ \text{資本金} \times \frac{1}{4} - (\text{資本準備金} + \text{利益準備金})\right)'
        note: '繰越利益剰余金を財源とする配当では利益準備金を、その他資本剰余金を財源とする配当では資本準備金を積み立てます。上限の判定では、資本金の 1/4 から**資本準備金と利益準備金の合計**を差し引きます。利益準備金だけを差し引く誤りが多い論点です。'

  - title: 連結会計
    topics: [consolidation]
    items:
      - name: のれん
        tex: '\text{のれん} = \text{子会社株式の取得原価} - (\text{子会社の資本} + \text{評価差額}) \times \text{親会社の持分比率}'
        note: '子会社の資産・負債を支配獲得日の時価で評価し直し、評価差額（時価 − 帳簿価額）を子会社の資本に含めてから計算します。のれんは20年以内に定額法で償却し、計算結果がマイナスなら負ののれん発生益（特別利益）とします。'
        term: goodwill
      - name: 非支配株主持分
        tex: '\text{非支配株主持分} = (\text{子会社の資本} + \text{評価差額}) \times \text{非支配株主の持分比率}'
        note: '支配獲得後は、毎期「子会社の当期純利益 × 非支配株主の持分比率」（非支配株主に帰属する当期純利益）だけ増やし、「子会社の配当金 × 非支配株主の持分比率」だけ減らします。のれんは親会社の持分にだけ生じ、非支配株主持分には含めません。'
        term: non-controlling-interests
      - name: 未実現利益（棚卸資産）
        tex: '\text{未実現利益} = \text{期末商品のうち内部取引分} \times \text{売上総利益率} = \text{期末商品のうち内部取引分} \times \frac{\text{加算率}}{1 + \text{加算率}}'
        note: '「原価に 25％ の利益を加算」と示されたら、売価に対する利益率は 0.25 ÷ 1.25 ＝ 20％ です。25％ をそのまま掛ける誤りが多発します。ダウンストリーム（親会社 → 子会社）は全額を親会社が負担し、アップストリーム（子会社 → 親会社）は「未実現利益 × 非支配株主の持分比率」を非支配株主持分にも負担させます。土地の売却益も同じ考え方で全額消去します。'
        term: consolidated-financial-statements

  - title: 費目別計算と製造間接費
    topics: [cost-elements, job-department]
    items:
      - name: 予定配賦率と予定配賦額
        tex: '\begin{aligned}\text{予定配賦率} &= \frac{\text{年間の製造間接費予算額}}{\text{年間の基準操業度}} \\ \text{予定配賦額} &= \text{予定配賦率} \times \text{実際操業度}\end{aligned}'
        note: '配賦額を求めるときに掛けるのは、基準操業度ではなく**実際**操業度（実際の直接作業時間・機械運転時間など）です。基準操業度には実際的生産能力・平均操業度・期待実際操業度などがあり、問題文で与えられます。部門別計算では、部門ごとに予定配賦率を求めます。'
        term: manufacturing-overhead
      - name: 製造間接費配賦差異
        tex: '\text{製造間接費配賦差異} = \text{予定配賦額} - \text{実際発生額}'
        note: 'プラスは有利差異（貸方差異）、マイナスは不利差異（借方差異）です。「実際 − 予定」で引くと符号が逆になるので、「予定より多くかかったら不利」と意味で確かめます。会計年度末に売上原価に振り替えます。'
      - name: 予算差異と操業度差異（公式法変動予算）
        tex: '\begin{aligned}\text{予算差異} &= (\text{変動費率} \times \text{実際操業度} + \text{固定費予算額}) - \text{実際発生額} \\ \text{操業度差異} &= \text{固定費率} \times (\text{実際操業度} - \text{基準操業度})\end{aligned}'
        note: '固定費率 ＝ 固定費予算額 ÷ 基準操業度。2つの差異の合計が製造間接費配賦差異になります。固定予算では、予算差異 ＝ 予算額 − 実際発生額、操業度差異 ＝ 予定配賦率 ×（実際操業度 − 基準操業度）です。公式法変動予算の操業度差異には、変動費率を含めません。'
      - name: 材料消費価格差異と賃率差異
        tex: '\begin{aligned}\text{材料消費価格差異} &= (\text{予定消費価格} - \text{実際消費価格}) \times \text{実際消費数量} \\ \text{賃率差異} &= (\text{予定賃率} - \text{実際賃率}) \times \text{実際作業時間}\end{aligned}'
        note: '予定価格（予定賃率）で消費額を計算したときに生じる差異で、掛けるのは実際の消費数量・作業時間です。賃率差異は「予定賃率 × 実際作業時間 − 当月の要支払額」でも求められ、要支払額は「当月支払額 − 前月末未払額 ＋ 当月末未払額」です。未払額の加減を逆にしないようにします。'

  - title: 総合原価計算
    topics: [process-costing]
    items:
      - name: 月末仕掛品原価（平均法）
        tex: '\text{月末仕掛品原価} = \frac{\text{月初仕掛品原価} + \text{当月製造費用}}{\text{完成品数量} + \text{月末仕掛品の完成品換算量}} \times \text{月末仕掛品の完成品換算量}'
        note: '完成品換算量 ＝ 数量 × 加工進捗度。工程の始点で投入する直接材料費は、進捗度にかかわらず**数量そのまま**で按分し、換算量を使うのは加工費だけです。完成品総合原価は「月初仕掛品原価 ＋ 当月製造費用 − 月末仕掛品原価」です。'
        term: process-costing
      - name: 月末仕掛品原価（先入先出法）
        tex: '\text{月末仕掛品原価} = \frac{\text{当月製造費用}}{\text{完成品数量} - \text{月初仕掛品換算量} + \text{月末仕掛品換算量}} \times \text{月末仕掛品換算量}'
        note: '月末仕掛品はすべて当月の投入分から生じたと考えるので、月初仕掛品原価を含めません。分母は当月投入量（換算量）です。月初仕掛品原価は全額が完成品原価になります。直接材料費（始点投入）では、換算量の代わりに数量を使います。'
      - name: 正常仕損の処理（度外視法）
        tex: '\text{月末仕掛品原価（両者負担）} = \frac{\text{月初仕掛品原価} + \text{当月製造費用}}{\text{完成品} + \text{月末仕掛品}} \times \text{月末仕掛品}'
        note: '月末仕掛品の加工進捗度が仕損の発生点を**過ぎていれば**両者負担、達していなければ完成品のみ負担です（終点発生なら必ず完成品のみ負担）。両者負担では正常仕損の数量を分母に入れないことで、仕損費が自動的に完成品と月末仕掛品に配分されます。完成品のみ負担では分母に正常仕損の数量（加工費は換算量）を加えて月末仕掛品原価を計算し、残りをすべて完成品原価とします。仕損品に評価額があるときは、負担させる側の原価から差し引きます。'
      - name: 等級別総合原価計算
        tex: '\text{各等級製品の完成品原価} = \text{完成品総合原価} \times \frac{\text{その等級の完成品数量} \times \text{等価係数}}{\sum(\text{完成品数量} \times \text{等価係数})}'
        note: '「完成品数量 × 等価係数」を積数といい、積数の比で完成品総合原価を按分します。各等級の単位原価は「按分した原価 ÷ その等級の完成品数量」で、積数で割らないようにします。'

  - title: 標準原価計算
    topics: [standard-costing]
    items:
      - name: 直接材料費差異
        tex: '\begin{aligned}\text{価格差異} &= (\text{標準価格} - \text{実際価格}) \times \text{実際消費量} \\ \text{数量差異} &= \text{標準価格} \times (\text{標準消費量} - \text{実際消費量})\end{aligned}'
        note: '標準消費量 ＝ 当月投入量 × 製品1単位当たりの標準消費量。当月投入量は「完成品 − 月初仕掛品 ＋ 月末仕掛品」で、始点投入の材料は数量、加工費は換算量で数えます（完成品数量を使う誤りに注意）。価格差異には**実際**消費量、数量差異には**標準**価格を掛けます。総差異は「標準原価 − 実際原価」で、2つの差異の合計に一致します。'
        term: standard-costing
      - name: 直接労務費差異
        tex: '\begin{aligned}\text{賃率差異} &= (\text{標準賃率} - \text{実際賃率}) \times \text{実際作業時間} \\ \text{作業時間差異} &= \text{標準賃率} \times (\text{標準作業時間} - \text{実際作業時間})\end{aligned}'
        note: '直接材料費差異の価格を賃率に、数量を作業時間に置き換えた形です。標準作業時間は、当月投入の完成品換算量に製品1単位当たりの標準作業時間を掛けて求めます。'
      - name: 製造間接費差異（公式法変動予算・3分法）
        tex: '\begin{aligned}\text{予算差異} &= (\text{変動費率} \times \text{実際操業度} + \text{固定費予算額}) - \text{実際発生額} \\ \text{能率差異} &= \text{標準配賦率} \times (\text{標準操業度} - \text{実際操業度}) \\ \text{操業度差異} &= \text{固定費率} \times (\text{実際操業度} - \text{基準操業度})\end{aligned}'
        note: '標準配賦率 ＝ 変動費率 ＋ 固定費率で、3つの差異の合計は「標準配賦額 − 実際発生額」になります。能率差異を変動費部分だけで計算し、固定費部分を操業度差異に含める分け方（操業度差異 ＝ 固定費率 ×（標準操業度 − 基準操業度））もあるので、問題文の指示を確認します。'

  - title: 直接原価計算とCVP分析
    topics: [direct-costing-cvp]
    items:
      - name: 貢献利益と営業利益
        tex: '\text{貢献利益} = \text{売上高} - \text{変動費},\qquad \text{営業利益} = \text{貢献利益} - \text{固定費}'
        note: '変動費には変動売上原価（変動製造原価）だけでなく、変動販売費も含めます（売上高 − 変動売上原価 は変動製造マージン）。貢献利益率 ＝ 貢献利益 ÷ 売上高 ＝ 1 − 変動費率。'
      - name: 損益分岐点
        tex: '\begin{aligned}\text{損益分岐点売上高} &= \frac{\text{固定費}}{1 - \text{変動費率}} = \frac{\text{固定費}}{\text{貢献利益率}} \\ \text{損益分岐点販売量} &= \frac{\text{固定費}}{\text{製品1単位当たりの貢献利益}}\end{aligned}'
        note: '固定費には、固定製造原価と固定販売費及び一般管理費の両方を含めます。販売量で答える問題では、売上高を販売単価で割るか、単位当たり貢献利益で固定費を割ります。'
        term: break-even-point
      - name: 目標利益を達成する売上高
        tex: '\begin{aligned}\text{目標営業利益額のとき：}\ \text{売上高} &= \frac{\text{固定費} + \text{目標営業利益}}{\text{貢献利益率}} \\ \text{目標売上高営業利益率のとき：}\ \text{売上高} &= \frac{\text{固定費}}{\text{貢献利益率} - \text{目標売上高営業利益率}}\end{aligned}'
        note: '目標が売上高営業利益率で与えられたときは、利益が売上高に比例するので分母から差し引きます。分子に「売上高 × ○％」を足そうとすると、未知数が両辺に残ってしまいます。'
        term: cvp-analysis
      - name: 安全余裕率と損益分岐点比率
        tex: '\text{安全余裕率} = \frac{\text{売上高} - \text{損益分岐点売上高}}{\text{売上高}},\qquad \text{損益分岐点比率} = \frac{\text{損益分岐点売上高}}{\text{売上高}}'
        note: '2つを足すと 1（100％）になります。安全余裕率は、売上高があと何％減ると損益分岐点に達するかを表し、高いほど安全です。分母は損益分岐点売上高ではなく、**実際（予想）の売上高**です。'
      - name: 固定費調整
        tex: '\begin{aligned}\text{全部原価計算の営業利益} = {}& \text{直接原価計算の営業利益} \\ & + \text{期末在庫の固定製造原価} - \text{期首在庫の固定製造原価}\end{aligned}'
        note: '在庫（仕掛品・製品）に含まれる固定製造原価の分だけ、2つの営業利益がずれます。在庫が増えれば（生産量 ＞ 販売量）全部原価計算の利益の方が大きくなります。固定販売費及び一般管理費はどちらの方法でも期間費用なので、調整に入れません。'
        term: direct-costing
      - name: 高低点法
        tex: '\begin{aligned}\text{変動費率} &= \frac{\text{最高操業度の原価} - \text{最低操業度の原価}}{\text{最高操業度} - \text{最低操業度}} \\ \text{固定費} &= \text{最高操業度の原価} - \text{変動費率} \times \text{最高操業度}\end{aligned}'
        note: '最高点・最低点は、原価の大小ではなく**操業度**の大小で選びます。正常操業圏の外にある月のデータは、除いてから選びます。'
