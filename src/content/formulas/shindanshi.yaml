exam: shindanshi
title: 中小企業診断士 公式集
intro: '第1次試験の「経済学・経済政策」「財務・会計」「運営管理」で使う公式と、第2次試験 事例IV の経営分析・投資評価で使う式をまとめました。経営指標は100倍して％で表すことが多く、貸借対照表の数値に期中平均と期末値のどちらを使うかは問題文の指示に従います。$t$ は法人税等の税率、$r$ は割引率（資本コスト）です。'
updatedAt: '2026-11-26'
sections:
  - title: ミクロ経済学
    topics: [econ-micro]
    items:
      - name: 需要の価格弾力性
        tex: 'e = -\frac{\Delta Q / Q}{\Delta P / P} = -\frac{dQ}{dP}\cdot\frac{P}{Q}'
        note: '需要曲線は右下がりなので、マイナスを付けて正の値にします。$e > 1$（弾力的）なら値下げで売上高 $P \times Q$ が増え、$e < 1$ なら減ります。直線の需要曲線でも弾力性は点ごとに違い、中点で 1、価格が高い側ほど大きくなります。傾き $dQ/dP$ だけを答える誤りに注意します。所得弾力性（需要量の変化率 ÷ 所得の変化率）が負の財は下級財です。'
        term: price-elasticity-of-demand
      - name: 限界代替率と最適消費
        tex: '\mathrm{MRS}_{xy} = -\frac{dy}{dx}\bigg|_{U = \text{一定}} = \frac{MU_x}{MU_y},\qquad \text{最適消費：}\ \mathrm{MRS}_{xy} = \frac{P_x}{P_y}'
        note: '無差別曲線の接線の傾き（の絶対値）が予算線の傾き $P_x/P_y$ に等しい点で効用が最大になります。効用関数が $U = x^a y^b$ なら、所得 $I$ のうち $a/(a+b)$ を $x$ に支出し、$x^* = \frac{a}{a+b}\cdot\frac{I}{P_x}$ です。分子と分母（$x$ と $y$）を逆にしないようにします。'
      - name: 利潤最大化の条件
        tex: '\pi = PQ - C(Q),\qquad \text{完全競争：}\ P = MC,\qquad \text{独占：}\ MR = MC'
        note: '利潤を最大にする生産量では、限界収入 $MR$ と限界費用 $MC$ が等しくなります。完全競争企業はプライス・テイカーなので $MR = P$ です。独占企業は $MR = MC$ で生産量を決め、価格はその生産量に対応する需要曲線上の高さ（$P > MC$）です。逆需要関数が $P = a - bQ$ なら $MR = a - 2bQ$ で、傾きが2倍になります。'
      - name: 損益分岐点と操業停止点
        tex: '\text{損益分岐点：}\ P = \min AC,\qquad \text{操業停止点：}\ P = \min AVC'
        note: '完全競争企業の場合です。価格が平均費用 $AC$ の最低点を下回ると赤字ですが、平均可変費用 $AVC$ の最低点を上回っていれば、操業を続けた方が固定費の一部を回収できるので損失が小さくなります。企業の供給曲線は、操業停止点より上の限界費用曲線です。'

  - title: マクロ経済学
    topics: [econ-macro]
    items:
      - name: 均衡国民所得（45度線分析）
        tex: 'Y = C + I + G + (X - M),\qquad C = C_0 + c\,(Y - T)'
        note: '$c$ は限界消費性向（$0 < c < 1$）、$C_0$ は基礎消費です。閉鎖経済・定額税なら $Y^* = \frac{1}{1-c}(C_0 - cT + I + G)$。完全雇用国民所得での総需要の不足をデフレ・ギャップ、超過をインフレ・ギャップといい、ギャップの大きさは「国民所得の差 ÷ 乗数」で、国民所得の差そのものではありません。'
      - name: 政府支出乗数（投資乗数）
        tex: '\Delta Y = \frac{1}{1-c}\,\Delta G,\qquad \text{比例税・輸入あり：}\ \Delta Y = \frac{1}{1-c(1-t)+m}\,\Delta G'
        note: '$t$ は所得税率、$m$ は限界輸入性向です。投資の増加 $\Delta I$ にも同じ乗数がかかります。比例税や輸入があると分母が大きくなり、乗数は小さくなります。限界貯蓄性向 $s = 1 - c$ を使えば $1/s$ です。'
        term: multiplier-effect
      - name: 租税乗数
        tex: '\Delta Y = -\frac{c}{1-c}\,\Delta T'
        note: '定額税の場合です。減税はまず可処分所得を増やし、そのうち $c$ の割合だけが消費に回るので、租税乗数の大きさは政府支出乗数より 1 小さく、符号は負になります。政府支出乗数と同じ $1/(1-c)$ を使う誤りが典型です。'
      - name: 均衡予算乗数
        tex: '\Delta G = \Delta T \;\Rightarrow\; \Delta Y = \left(\frac{1}{1-c} - \frac{c}{1-c}\right)\Delta G = \Delta G'
        note: '政府支出の増加を同額の定額税で賄うと、国民所得は政府支出の増加額と同じだけ増えます（乗数 1）。財政収支が変わらなくても所得が増える点がポイントです。比例税や輸入がある場合は 1 になりません。'
      - name: IS 曲線
        tex: 'Y = \frac{1}{1-c}\left(C_0 - cT + I_0 - b\,r + G\right) \;\Longleftrightarrow\; r = \frac{C_0 - cT + I_0 + G}{b} - \frac{1-c}{b}\,Y'
        note: '投資関数を $I = I_0 - br$ としたときの財市場の均衡です。投資の利子弾力性 $b$ が小さいほど IS 曲線は急になり、$b = 0$ なら垂直で金融政策は無効になります。政府支出の増加や減税は、IS 曲線を右にシフトさせます。'
      - name: LM 曲線
        tex: '\frac{M}{P} = kY - h\,r \;\Longleftrightarrow\; r = \frac{k}{h}\,Y - \frac{1}{h}\cdot\frac{M}{P}'
        note: '貨幣需要 $L = kY - hr$（取引需要と資産需要）と実質貨幣供給 $M/P$ が等しくなる貨幣市場の均衡です。貨幣需要の利子弾力性 $h$ が大きいほど LM 曲線は平らになり、流動性のわなでは水平になって、金融政策は無効、財政政策はクラウディング・アウトが生じず最も有効です。$h = 0$（垂直）なら財政政策が無効になります。'
      - name: 貨幣乗数（信用乗数）
        tex: 'M = \frac{c+1}{c+r}\,H,\qquad c = \frac{C}{D},\quad r = \frac{R}{D}'
        note: '$M$ はマネーストック（現金 $C$ ＋ 預金 $D$）、$H$ はマネタリーベース（現金 $C$ ＋ 準備 $R$）、$c$ は現金預金比率、$r$ は準備率です。現金の保有を考えない信用創造の式 $1/r$ と混同しないようにします。準備率や現金預金比率が上がると、乗数は小さくなります。'
      - name: 成長会計
        tex: '\frac{\Delta Y}{Y} = \frac{\Delta A}{A} + \alpha\,\frac{\Delta K}{K} + (1-\alpha)\,\frac{\Delta L}{L}'
        note: 'コブ＝ダグラス型生産関数 $Y = AK^{\alpha}L^{1-\alpha}$ から導かれる近似式で、$\alpha$ は資本分配率、$1-\alpha$ は労働分配率です。経済成長率から資本と労働の寄与を差し引いた残りが、全要素生産性（TFP）の上昇率（ソロー残差）です。資本の伸び率に労働分配率を掛ける取り違えに注意します。'

  - title: 経営分析（収益性・効率性）
    topics: [accounting]
    items:
      - name: 売上高利益率
        tex: '\begin{aligned}\text{売上高総利益率} &= \frac{\text{売上総利益}}{\text{売上高}} \\ \text{売上高営業利益率} &= \frac{\text{営業利益}}{\text{売上高}} \\ \text{売上高経常利益率} &= \frac{\text{経常利益}}{\text{売上高}}\end{aligned}'
        note: 'どの段階の利益で悪化しているかを見るため、売上原価率（＝ 1 − 売上高総利益率）や売上高販管費率と合わせて比べます。分子の利益（総利益・営業利益・経常利益）を、問われている指標名と一致させます。'
      - name: ROA（総資本経常利益率）
        tex: '\mathrm{ROA} = \frac{\text{経常利益}}{\text{総資本}} = \frac{\text{経常利益}}{\text{売上高}} \times \frac{\text{売上高}}{\text{総資本}}'
        note: '総資本 ＝ 負債 ＋ 純資産（＝ 総資産）。売上高利益率（収益性）と総資本回転率（効率性）に分解できます。分子に事業利益（営業利益 ＋ 受取利息・配当金）や当期純利益を使う定義もあるので、問題文の指標名で判断します。'
      - name: ROE とデュポン分解
        tex: '\mathrm{ROE} = \frac{\text{当期純利益}}{\text{自己資本}} = \frac{\text{当期純利益}}{\text{売上高}} \times \frac{\text{売上高}}{\text{総資本}} \times \frac{\text{総資本}}{\text{自己資本}}'
        note: '3番目の項は財務レバレッジで、自己資本比率の逆数です。負債を増やすと ROE は上がりますが、安全性は下がります。分母は総資本ではなく**自己資本**です。'
      - name: 回転率と回転期間
        tex: '\text{総資本回転率} = \frac{\text{売上高}}{\text{総資本}}\ (\text{回}),\qquad \text{回転期間} = \frac{\text{資産（負債）の額}}{\text{売上高}} \times 365\ (\text{日})'
        note: '有形固定資産回転率・売上債権回転率・棚卸資産回転率も、分母を各資産に替えて同じように計算します。回転率は高いほど、回転期間は短いほど効率的です。棚卸資産や仕入債務については、売上高の代わりに売上原価を使う定義もあります。'

  - title: 経営分析（安全性）
    topics: [accounting]
    items:
      - name: 流動比率と当座比率
        tex: '\text{流動比率} = \frac{\text{流動資産}}{\text{流動負債}},\qquad \text{当座比率} = \frac{\text{当座資産}}{\text{流動負債}}'
        note: '短期の支払能力を表し、高いほど安全です。当座資産は現金預金・売上債権・有価証券など換金しやすい資産で、棚卸資産は含めません。一般に流動比率は 200％ 以上、当座比率は 100％ 以上が望ましいといわれます。'
      - name: 自己資本比率と負債比率
        tex: '\text{自己資本比率} = \frac{\text{自己資本}}{\text{総資本}},\qquad \text{負債比率} = \frac{\text{負債}}{\text{自己資本}}'
        note: '自己資本比率は高いほど、負債比率は低いほど安全です。負債比率の分母は総資本ではなく自己資本です（負債 ÷ 総資本 は、自己資本比率と足して 1 になる別の比率）。'
      - name: 固定比率と固定長期適合率
        tex: '\text{固定比率} = \frac{\text{固定資産}}{\text{自己資本}},\qquad \text{固定長期適合率} = \frac{\text{固定資産}}{\text{自己資本} + \text{固定負債}}'
        note: '長期に資金が固定される固定資産を、自己資本や長期の資金でどれだけ賄っているかを見る指標で、**低い**ほど安全です（固定長期適合率は 100％ 以下が目安）。流動比率などと違い、高いほど良いわけではありません。'
      - name: インタレスト・カバレッジ・レシオ
        tex: '\text{インタレスト・カバレッジ・レシオ} = \frac{\text{営業利益} + \text{受取利息} + \text{受取配当金}}{\text{支払利息} + \text{割引料}}\ (\text{倍})'
        note: '本業と金融収益から得た利益で、金利の支払いを何倍賄えるかを示し、高いほど安全です。分子は経常利益ではなく、営業利益に受取利息・配当金を加えた事業利益です。'

  - title: 損益分岐点とCVP分析
    topics: [accounting]
    items:
      - name: 損益分岐点売上高
        tex: '\text{損益分岐点売上高} = \frac{\text{固定費}}{1 - \text{変動費率}} = \frac{\text{固定費}}{\text{限界利益率}}'
        note: '限界利益（貢献利益）＝ 売上高 − 変動費。2期分の売上高と総費用から変動費率を求めるときは「総費用の増加額 ÷ 売上高の増加額」とします。事例IV では営業外損益を固定費に含めて経常利益ベースで計算することがあるので、問題文の指示を確認します。'
        term: break-even-point
      - name: 目標利益を達成する売上高
        tex: '\text{必要売上高} = \frac{\text{固定費} + \text{目標利益}}{1 - \text{変動費率}}'
        note: '目標が売上高利益率 $p$ で与えられたときは、分母を $1 - \text{変動費率} - p$ にします。設備投資や人員の増加で固定費が変わる施策では、変更後の固定費で計算します。'
        term: cvp-analysis
      - name: 損益分岐点比率と安全余裕率
        tex: '\text{損益分岐点比率} = \frac{\text{損益分岐点売上高}}{\text{売上高}},\qquad \text{安全余裕率} = 1 - \text{損益分岐点比率}'
        note: '損益分岐点比率は低いほど、安全余裕率は高いほど、売上高の減少に強い収益構造です。分母は損益分岐点売上高ではなく、実際（計画）の売上高です。'
      - name: 経営レバレッジ係数
        tex: '\text{経営レバレッジ係数} = \frac{\text{限界利益}}{\text{営業利益}} = \frac{1}{\text{安全余裕率}}'
        note: '売上高が 1％ 変化したときに営業利益が何％変化するかを表します。固定費の割合が高い（損益分岐点に近い）ほど大きく、利益が売上高の変動に大きく左右されます。'

  - title: キャッシュフローと投資評価
    topics: [accounting, corporate-finance]
    items:
      - name: 営業キャッシュフロー（間接法）
        tex: '\begin{aligned}\text{営業 CF} = {}& \text{税引前当期純利益} + \text{減価償却費} + \text{引当金の増加額} \\ & - \text{売上債権の増加額} - \text{棚卸資産の増加額} + \text{仕入債務の増加額} \\ & \pm \text{投資・財務活動に係る損益の修正} - \text{法人税等の支払額}\end{aligned}'
        note: '資産の増加はキャッシュの減少、負債の増加はキャッシュの増加として扱います（減少なら符号が逆）。固定資産売却益は差し引き、売却損は加え戻します。受取利息・配当金と支払利息は、いったん利益から戻して小計を出した後、実際の受取額・支払額を加減する様式が一般的です。売上債権の増加額を足してしまう符号の誤りが最も多い間違いです。'
      - name: 投資案の税引後キャッシュフロー
        tex: '\begin{aligned}\text{税引後 CF} &= (\text{売上の増加} - \text{現金支出費用の増加}) \times (1 - t) + \text{減価償却費} \times t \\ &= \text{税引後利益の増加} + \text{減価償却費}\end{aligned}'
        note: '減価償却費は現金支出を伴いませんが、税金を「減価償却費 × 税率」だけ減らします（タックス・シールド）。減価償却費を全額足すのは、税引後利益から出発する下の形のときだけです。2つの形を混ぜて、減価償却費を二重に数えないようにします。'
      - name: 正味現在価値（NPV）
        tex: '\mathrm{NPV} = \sum_{t=1}^{n}\frac{CF_t}{(1+r)^t} - I_0'
        note: '$I_0$ は初期投資額です。NPV ＞ 0 なら採用し、複数案では NPV の大きい案を選びます。毎年の CF が一定なら「CF × 年金現価係数」で現在価値を求められます。最終年の設備の売却収入や運転資本の回収を加え忘れないようにします。'
      - name: 内部収益率（IRR）
        tex: '\sum_{t=1}^{n}\frac{CF_t}{(1+\mathrm{IRR})^t} = I_0'
        note: 'NPV がゼロになる割引率で、IRR ＞ 資本コストなら採用します。選択肢の利率で NPV を計算して符号が変わる点を探すか、2つの利率の間を直線補間して求めます。投資規模の異なる案を比べるときは、IRR より NPV を優先します。'
      - name: 回収期間
        tex: '\text{回収期間} = \frac{I_0}{\text{毎年の CF}}'
        note: '毎年の CF が一定のときの式で、一定でなければ累積 CF が投資額に達する年を探します。短いほど安全性が高いと評価しますが、貨幣の時間価値と回収後の CF を考慮しない欠点があります。'
      - name: フリーキャッシュフロー（FCF）
        tex: '\mathrm{FCF} = \text{営業利益} \times (1 - t) + \text{減価償却費} - \text{設備投資額} - \text{運転資本の増加額}'
        note: '債権者と株主の両方に分配できる CF で、WACC で割り引いて企業価値を求めます（株主価値 ＝ 企業価値 − 負債価値）。税引後営業利益から出発し、支払利息は差し引きません（利息の影響は WACC の側で考慮します）。運転資本の増加はキャッシュの減少です。'

  - title: 資本コストと企業価値
    topics: [corporate-finance]
    items:
      - name: CAPM
        tex: 'E[R_i] = R_f + \beta_i\,(E[R_M] - R_f),\qquad \beta_i = \frac{\operatorname{Cov}(R_i,\ R_M)}{\mathrm{V}[R_M]}'
        note: '$R_f$ は安全資産の利子率、$E[R_M] - R_f$ は市場リスク・プレミアムです。$\beta$ を掛けるのは市場の期待収益率そのものではなく、**リスク・プレミアム**です。$\beta = 1$ なら市場と同じリスク、$\beta > 1$ なら市場より大きく変動します。'
      - name: 加重平均資本コスト（WACC）
        tex: '\mathrm{WACC} = \frac{D}{D+E}\,r_D\,(1-t) + \frac{E}{D+E}\,r_E'
        note: '$D$ は負債、$E$ は株主資本の価値で、構成比は原則として**時価**で計算します。節税効果 $(1-t)$ を掛けるのは負債コスト $r_D$ だけです。株主資本コスト $r_E$ は CAPM などで求めます。'
      - name: 配当割引モデル
        tex: '\text{定額配当：}\ P_0 = \frac{D}{r},\qquad \text{定率成長：}\ P_0 = \frac{D_1}{r - g}'
        note: '$r$ は株主の要求収益率、$g$ は配当の成長率で、$r > g$ のときに成り立ちます。分子は**来期の配当** $D_1 = D_0(1+g)$ で、支払済みの今期の配当 $D_0$ を使う誤りが典型です。FCF が一定率 $g$ で成長するときの企業価値 $\mathrm{FCF}_1/(\mathrm{WACC} - g)$ も同じ形です。'

  - title: ポートフォリオ
    topics: [corporate-finance]
    items:
      - name: 期待収益率と分散（シナリオ分析）
        tex: 'E[R] = \sum_{s} p_s R_s,\qquad \sigma^2 = \sum_{s} p_s\,(R_s - E[R])^2'
        note: '$p_s$ は状況（好況・不況など）$s$ の生起確率で、合計は 1 です。リスクは標準偏差 $\sigma = \sqrt{\sigma^2}$ で測ります。2資産の共分散は $\sum_s p_s (R_{A,s} - E[R_A])(R_{B,s} - E[R_B])$ です。'
      - name: ポートフォリオの期待収益率
        tex: 'E[R_P] = w\,E[R_A] + (1-w)\,E[R_B]'
        note: '$w$ は資産 A への投資比率です。期待収益率は常に加重平均になりますが、リスク（標準偏差）は相関係数が 1 未満なら加重平均より小さくなります（分散投資の効果）。'
      - name: ポートフォリオの分散
        tex: '\sigma_P^2 = w^2\sigma_A^2 + (1-w)^2\sigma_B^2 + 2w(1-w)\,\rho_{AB}\,\sigma_A\sigma_B'
        note: '$\rho_{AB}\sigma_A\sigma_B$ は共分散です。$\rho_{AB} = 1$ なら $\sigma_P$ は標準偏差の加重平均に一致し、$\rho_{AB} = -1$ なら $w = \sigma_B/(\sigma_A + \sigma_B)$ でリスクをゼロにできます。共分散の項の係数 2 を落とす誤りに注意します。'

  - title: 生産管理
    topics: [production]
    items:
      - name: 経済的発注量（EOQ）
        tex: 'Q^* = \sqrt{\frac{2DS}{H}}'
        note: '$D$ は年間需要量、$S$ は1回当たりの発注費用、$H$ は1単位当たりの年間保管費用（単価 × 保管費率で与えられることもある）です。EOQ では年間発注費用 $SD/Q$ と年間保管費用 $HQ/2$ が等しくなります。平均在庫は $Q$ ではなく $Q/2$ で、需要量と保管費用の期間（年・月）をそろえます。'
        term: economic-order-quantity
      - name: 発注点（定量発注方式）
        tex: '\text{発注点} = \text{1日当たり平均需要量} \times \text{調達期間} + \text{安全在庫},\qquad \text{安全在庫} = k\,\sigma\sqrt{L}'
        note: '$k$ は安全係数（欠品率 5％ なら約 1.65）、$\sigma$ は1日当たり需要量の標準偏差、$L$ は調達期間（日）です。安全在庫は調達期間に比例するのではなく、$\sqrt{L}$ に比例します。定期発注方式では、ばらつきに備える期間が「発注間隔 ＋ 調達期間」になります。'
      - name: ライン編成効率
        tex: '\text{編成効率} = \frac{\text{作業時間の合計}}{\text{工程数} \times \text{サイクルタイム}},\qquad \text{サイクルタイム} = \frac{\text{稼働時間}}{\text{計画生産量}}'
        note: 'バランスロス率 ＝ 1 − 編成効率。必要な最少工程数は「作業時間の合計 ÷ サイクルタイム」を**切り上げた**整数です。サイクルタイムは最長の作業時間より短くできません。サイクルタイムが与えられないときは、最も時間の長い工程（ネック工程）の時間で編成効率を計算します。'
      - name: 設備総合効率
        tex: '\text{設備総合効率} = \text{時間稼働率} \times \text{性能稼働率} \times \text{良品率}'
        note: '時間稼働率 ＝（負荷時間 − 停止時間）÷ 負荷時間、性能稼働率 ＝ 基準サイクルタイム × 加工数量 ÷ 稼働時間、良品率 ＝ 良品数量 ÷ 加工数量です。負荷時間は操業時間から計画停止（休憩・計画保全など）を除いた時間で、操業時間そのものではありません。'
      - name: 標準時間
        tex: '\begin{aligned}\text{外掛け法：}\ \text{標準時間} &= \text{正味時間} \times (1 + \text{余裕率}) \\ \text{内掛け法：}\ \text{標準時間} &= \frac{\text{正味時間}}{1 - \text{余裕率}}\end{aligned}'
        note: '外掛け法の余裕率は「余裕時間 ÷ 正味時間」、内掛け法は「余裕時間 ÷（正味時間 ＋ 余裕時間）」です。正味時間は、観測時間の代表値にレイティング係数（作業者のペースを標準のペースに補正する係数）を掛けて求めます。余裕率の定義を取り違えると標準時間がずれます。'

  - title: 店舗・販売管理
    topics: [retail]
    items:
      - name: 値入率と売価
        tex: '\text{売価値入率} = \frac{\text{売価} - \text{原価}}{\text{売価}},\qquad \text{売価} = \frac{\text{原価}}{1 - \text{売価値入率}}'
        note: '小売業の値入率はふつう売価を基準にします。原価 700円 の商品に売価値入率 30％ をとる売価は 700 ÷ 0.7 ＝ 1,000円 で、700 × 1.3 ＝ 910円 ではありません。原価を基準にする原価値入率（値入高 ÷ 原価）と区別します。'
      - name: GMROI
        tex: '\mathrm{GMROI} = \frac{\text{粗利益}}{\text{平均在庫高（原価）}} = \frac{\text{粗利益}}{\text{売上高}} \times \frac{\text{売上高}}{\text{平均在庫高（原価）}}'
        note: '在庫に投下した資金が生んだ粗利益の効率を示し、分母は**原価**ベースの在庫です。売価ベースの在庫を使う交差比率（粗利益率 × 売上高 ÷ 平均在庫高（売価））とは、$\mathrm{GMROI} = \text{交差比率} \div (1 - \text{値入率})$ の関係にあります。'
        term: gmroi
      - name: 相乗積
        tex: '\text{相乗積}_i = \text{部門 } i \text{ の粗利益率} \times \text{部門 } i \text{ の売上高構成比},\qquad \sum_i \text{相乗積}_i = \text{全体の粗利益率}'
        note: '各部門が店全体の粗利益率にどれだけ貢献しているかを示します。粗利益率が高い部門でも、売上高構成比が小さければ相乗積は小さくなります。構成比は売上高で計算し、粗利益の構成比を使わないようにします。'
      - name: ハフモデル
        tex: 'P_{ij} = \frac{S_j / T_{ij}^{\lambda}}{\sum_{k} S_k / T_{ik}^{\lambda}}'
        note: '$P_{ij}$ は地区 $i$ の消費者が店舗 $j$ を選ぶ確率、$S_j$ は売場面積、$T_{ij}$ は距離（時間距離）、$\lambda$ は距離抵抗の係数で、修正ハフモデルでは $\lambda = 2$ とします。店舗 $j$ の来店客数は「地区 $i$ の人口（世帯数）× $P_{ij}$」を地区ごとに合計します。距離を2乗し忘れる誤りに注意します。'
