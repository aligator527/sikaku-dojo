exam: boki-1
title: 日商簿記1級 公式集
intro: '日商簿記1級の計算でよく使う式を、商業簿記・会計学と工業簿記・原価計算の論点ごとにまとめました。会計基準は2027年度の出題区分表と、試験年度の4月1日に施行されている基準（リースは企業会計基準第34号）に合わせています。$r$ は割引率（利子率）、$CF_t$ は $t$ 年度末のキャッシュ・フロー、$HR$・$AR$・$CR$ はそれぞれ取得時（発生時）・期中平均・決算時の為替相場です。'
updatedAt: '2026-11-26'
sections:
  - title: 現在価値と金融商品
    topics: [financial-instruments]
    items:
      - name: 現価係数と年金現価係数
        tex: '\text{現価係数} = \frac{1}{(1+r)^n},\qquad \text{年金現価係数} = \sum_{t=1}^{n}\frac{1}{(1+r)^t} = \frac{1-(1+r)^{-n}}{r}'
        note: '毎年末に同額を受け取る（支払う）キャッシュ・フローの現在価値は「年額 × 年金現価係数」です。期首払い（前払い）なら1回目は割り引かないので「年額 ×（$n-1$ 年の年金現価係数 ＋ 1）」になります。係数表は、利率と年数の行・列を取り違えないように読みます。'
      - name: 償却原価法（利息法）
        tex: '\begin{aligned}\text{利息配分額} &= \text{期首の帳簿価額} \times \text{実効利子率} \\ \text{償却額} &= \text{利息配分額} - \text{額面金額} \times \text{クーポン利率}\end{aligned}'
        note: '実効利子率は、将来のクーポンと償還額の現在価値が取得価額に等しくなる利率です。償却額を加えた額が次期の期首帳簿価額になり、償還時に額面と一致します。利息配分額の計算で**額面**に実効利子率を掛ける誤りと、クーポン受取額を差し引き忘れる誤りが典型です。定額法は、継続適用を条件に認められる簡便法です。'
      - name: 為替予約の振当処理（直直差額・直先差額）
        tex: '\begin{aligned}\text{直直差額} &= \text{外貨額} \times (\text{予約日の直物レート} - \text{取引日の直物レート}) \\ \text{直先差額} &= \text{外貨額} \times (\text{予約レート} - \text{予約日の直物レート})\end{aligned}'
        note: '取引の後に為替予約を付したとき、直直差額は予約日の属する期の為替差損益とし、直先差額は原則として予約日から決済日までの期間にわたって配分します（未経過分は前払費用・前受収益。重要性が乏しければ当期の損益にできます）。2つの合計は「外貨額 ×（予約レート − 取引日の直物レート）」です。式は債権の場合で、債務では損益の符号が逆になります。'

  - title: 固定資産・減損・資産除去債務
    topics: [fixed-assets-impairment]
    items:
      - name: 級数法
        tex: '\text{第 }k\text{ 年度の減価償却費} = (\text{取得原価} - \text{残存価額}) \times \frac{n-k+1}{1+2+\cdots+n},\qquad 1+2+\cdots+n = \frac{n(n+1)}{2}'
        note: '$n$ は耐用年数で、分子はその年度の期首時点の残存耐用年数です。償却額が毎年一定額ずつ減り、定率法と同じく初期ほど大きくなります。'
        term: depreciation
      - name: 資産除去債務の計上額
        tex: '\text{資産除去債務} = \frac{\text{除去に要する将来キャッシュ・フローの見積額}}{(1+r)^n}'
        note: '有形固定資産の取得時に計上し、同額を資産の帳簿価額に加えて（除去費用の資産計上）残存耐用年数で減価償却します。割引率 $r$ は貨幣の時間価値を反映した無リスクの税引前の利率です。見積額が増加したときはその時点の割引率で、減少したときは負債計上時の割引率で調整額を計算します。'
      - name: 利息費用（時の経過による調整額）
        tex: '\text{利息費用} = \text{期首の資産除去債務} \times r'
        note: '毎期この額だけ資産除去債務を増やし、損益計算書では関連する有形固定資産の減価償却費と同じ区分に計上します。支払利息（営業外費用）にはしません。除去時の実際の支出額と債務残高との差額（履行差額）も、原則として減価償却費と同じ区分に計上します。'
      - name: 減損損失の認識の判定
        tex: '\text{割引前将来キャッシュ・フローの総額} < \text{帳簿価額} \;\Rightarrow\; \text{減損損失を認識}'
        note: '減損の兆候がある資産（資産グループ）について判定します。判定には**割り引かない**キャッシュ・フローを使い、見積期間は経済的残存使用年数（資産グループでは主要な資産の年数）と20年のいずれか短い方です。20年を超える場合は、21年目以降のキャッシュ・フローから求めた20年経過時点の回収可能価額を加えます。'
      - name: 減損損失の測定
        tex: '\text{減損損失} = \text{帳簿価額} - \text{回収可能価額},\qquad \text{回収可能価額} = \max(\text{正味売却価額},\ \text{使用価値})'
        note: '使用価値は、継続使用と使用後の処分から見込まれる将来キャッシュ・フローの**現在価値**です（認識の判定は割引前、測定は割引後）。回収可能価額は2つのうち**大きい方**で、小さい方を使うと減損損失が過大になります。資産グループの減損損失は帳簿価額の比率などで各資産に配分し、計上した減損損失は戻し入れません。'
        term: impairment-of-fixed-assets

  - title: リース
    topics: [lease]
    items:
      - name: リース負債の当初測定
        tex: '\text{リース負債} = \sum_{t=1}^{n}\frac{\text{リース料}_t}{(1+r)^t}'
        note: '割引率 $r$ は、貸手の計算利子率を知り得る場合はその利率、知り得ない場合は借手の追加借入に適用されると合理的に見積もられる利率です。リース料を期首に支払う契約では、1回目を割り引かずに $t = 0$ から合計します。使用権資産は、リース負債の額にリース開始日までに支払ったリース料と付随費用を加えて計上します。'
        term: lease-accounting
      - name: 利息法による支払利息
        tex: '\text{支払利息} = \text{期首のリース負債残高} \times r,\qquad \text{リース負債の返済額} = \text{リース料} - \text{支払利息}'
        note: '利息相当額は、利息法で各期に配分するのが原則です。返済が進むほど支払利息は減り、元本の返済額が増えます。例：年額 1,000,000円・5年・後払い・年4％ なら、リース負債は約 4,451,822円、1年目の支払利息は約 178,073円 です。リース料の全額でリース負債を減らす誤りに注意します。'
      - name: 使用権資産の減価償却
        tex: '\text{減価償却費} = \frac{\text{使用権資産の取得原価}}{\text{借手のリース期間}}\quad (\text{所有権が移転しない場合、残存価額ゼロ})'
        note: '契約上の諸条件に照らして原資産の所有権が借手に移転すると認められるリースでは、自己所有の資産と同じ方法・経済的使用可能予測期間で償却します。それ以外のリースでは、原則として借手のリース期間を耐用年数、残存価額をゼロとします。'

  - title: 退職給付
    topics: [retirement-benefits]
    items:
      - name: 退職給付費用
        tex: '\begin{aligned}\text{退職給付費用} = {}& \text{勤務費用} + \text{利息費用} - \text{期待運用収益} \\ & \pm \text{数理計算上の差異の費用処理額} \pm \text{過去勤務費用の費用処理額}\end{aligned}'
        note: '利息費用 ＝ 期首の退職給付債務 × 割引率、期待運用収益 ＝ 期首の年金資産 × 長期期待運用収益率です。不利差異（債務の増加・運用収益の不足）の費用処理額は加算し、有利差異は減算します。期待運用収益の計算に、期末の年金資産や実際の運用収益を使うのは誤りです。'
        term: retirement-benefit-accounting
      - name: 数理計算上の差異の発生額
        tex: '\begin{aligned}\text{債務の差異} &= \text{期末の実際の退職給付債務} - (\text{期首債務} + \text{勤務費用} + \text{利息費用} - \text{退職給付の支払額}) \\ \text{資産の差異} &= (\text{期首年金資産} + \text{期待運用収益} + \text{掛金拠出額} - \text{年金給付額}) - \text{期末の実際の年金資産}\end{aligned}'
        note: 'どちらもプラスなら不利差異（借方差異）です。債務の側では退職一時金と年金給付の両方を、資産の側では年金給付だけを差し引きます。差異は平均残存勤務期間以内の一定の年数で定額法（または定率法）により費用処理し、発生年度から始めるか翌年度から始めるかは問題文の指示に従います。'
      - name: 退職給付引当金の推移
        tex: '\text{期末の退職給付引当金} = \text{期首の引当金} + \text{退職給付費用} - \text{年金掛金の拠出額} - \text{退職一時金の支払額}'
        note: '年金基金から従業員への年金給付は、退職給付債務と年金資産が同額減るだけなので、引当金は変わりません。個別貸借対照表の引当金は「退職給付債務 − 年金資産 − 未認識の不利差異（有利差異なら加算）」と一致します。連結貸借対照表では未認識分も含めた「退職給付債務 − 年金資産」を退職給付に係る負債とし、未認識分は税効果を調整して退職給付に係る調整累計額（その他の包括利益累計額）に計上します。'

  - title: 収益認識
    topics: [revenue-recognition]
    items:
      - name: 取引価格の配分
        tex: '\text{履行義務への配分額} = \text{取引価格} \times \frac{\text{その履行義務の独立販売価格}}{\text{独立販売価格の合計}}'
        note: '複数の財・サービスを一括して販売したときに使い、値引きも原則として各履行義務に比例して配分します。ポイント制度では、付与したポイントも履行義務として独立販売価格（将来の失効見込みを考慮）で配分し、契約負債に計上します。変動対価は期待値または最頻値で見積もり、収益の著しい減額が生じない可能性が高い部分だけを取引価格に含めます。'
        term: revenue-recognition
      - name: 工事収益（原価比例法）
        tex: '\begin{aligned}\text{進捗度} &= \frac{\text{累計の実際発生原価}}{\text{見積工事原価総額}} \\ \text{当期の工事収益} &= \text{工事収益総額} \times \text{進捗度} - \text{前期までの工事収益の累計額}\end{aligned}'
        note: '見積工事原価総額は「実際発生原価の累計 ＋ 今後の発生見込額」で、見積りが変わったら変更後の総額で進捗度を計算し直します。前期までの計上額を差し引き忘れると、累計額を当期分として計上してしまいます。進捗度を合理的に見積もれないが発生する費用の回収が見込まれる場合は、原価回収基準（発生した原価と同額の収益）によります。'
      - name: 工事損失引当金
        tex: '\text{工事損失引当金} = (\text{見積工事原価総額} - \text{工事収益総額}) \times (1 - \text{進捗度})'
        note: '工事損失が見込まれた期に、損失見込額のうち**まだ計上していない部分**を引き当てます（繰入額は工事原価に含める）。損失見込額の全額を引き当てると、進捗度に応じて既に損益に含まれている損失と二重になります。翌期以降は、見積りの見直しと工事の進捗に応じて引当金を取り崩します。'

  - title: 税効果会計
    topics: [tax-effect, consolidation]
    items:
      - name: 繰延税金資産・繰延税金負債（資産負債法）
        tex: '\text{繰延税金資産（負債）} = \text{一時差異} \times \text{差異が解消する年度の法定実効税率}'
        note: '決算日までに国会で成立した税法の税率を使います。税率が変わったときは期首からの残高も新しい税率で計算し直し、差額は法人税等調整額（その他有価証券評価差額金などに係る分は純資産）で処理します。繰延税金資産は、将来の課税所得などから回収可能性があると判断した部分だけ計上します。'
        term: tax-effect-accounting
      - name: 法人税等調整額
        tex: '\begin{aligned}\text{法人税等調整額} = {}& (\text{期首の繰延税金資産} - \text{期末の繰延税金資産}) \\ & + (\text{期末の繰延税金負債} - \text{期首の繰延税金負債})\end{aligned}'
        note: '値がプラスなら借方（法人税等に加算）、マイナスなら貸方（法人税等から控除）です。繰延税金資産が増えると、法人税等は減ります。その他有価証券の評価差額や、連結で子会社の資産・負債を時価評価した評価差額に係る繰延税金は純資産（資本）で処理するので、この計算から除きます。'
      - name: 連結の未実現利益と税効果
        tex: '\text{繰延税金資産} = \text{消去した未実現利益} \times \text{売手側の会社の法定実効税率}'
        note: '未実現利益を消去すると、売手側が個別で納めた税金が前払いの性格をもつので、買手側ではなく**売手側**の税率で繰延税金資産を計上します。アップストリームでは、税効果を控除した後の未実現利益を非支配株主持分にも負担させます。'

  - title: 純資産・企業結合
    topics: [equity-business-combination]
    items:
      - name: ストック・オプションの株式報酬費用
        tex: '\begin{aligned}\text{当期の費用} = {}& \text{公正な評価単価} \times \text{権利確定見込数} \\ & \times \frac{\text{付与日から当期末までの月数}}{\text{対象勤務期間の月数}} - \text{前期までの計上額}\end{aligned}'
        note: '公正な評価単価は付与日の値で固定し、その後の株価の変動では見直しません（条件変更を除く）。失効の見込みが変わったら権利確定見込数を見直し、累計額で調整します。権利確定日には実際の確定数を使います。相手勘定は新株予約権（純資産）です。'
      - name: 権利行使時の払込資本
        tex: '\text{増加する資本金・資本準備金} = \text{権利行使に伴う払込金額} + \text{行使された新株予約権の帳簿価額}'
        note: '新株を発行するときは、少なくとも半額を資本金とし、残りを資本準備金にできます（問題文の指示に従う）。自己株式を交付するときは、払込金額と新株予約権の合計と、自己株式の帳簿価額との差額をその他資本剰余金（自己株式処分差益・差損）とします。権利行使期間の満了により失効した分は新株予約権戻入益（特別利益）です。'
      - name: 企業結合ののれん
        tex: '\text{のれん} = \text{取得原価（交付株式の時価など）} - \text{識別可能資産・負債の時価の純額}'
        note: '取得原価は、交付した株式の企業結合日の時価などで測定します。外部のアドバイザーに支払った報酬などの取得関連費用は、取得原価に含めず発生した期の費用にします。マイナスの場合は、資産・負債の識別と時価の配分を見直したうえで負ののれん発生益（特別利益）とします。のれんは20年以内のその効果の及ぶ期間にわたり、定額法などで規則的に償却します。'
        term: goodwill

  - title: 連結・持分法・在外子会社
    topics: [consolidation]
    items:
      - name: 段階取得に係る差損益
        tex: '\text{段階取得に係る差損益} = \text{既存持分の支配獲得日の時価} - \text{既存持分の帳簿価額}'
        note: '支配獲得前から保有していた子会社株式を、連結上は支配獲得日の時価で評価し直し、差額を当期の損益とします。のれんは、この時価ベースの投資額の合計と、支配獲得日の子会社の資本（時価評価後）のうち親会社持分との差額です。個別財務諸表では原価のままです。'
        term: consolidated-financial-statements
      - name: 持分法による投資損益
        tex: '\text{持分法による投資損益} = \text{関連会社の当期純利益} \times \text{持分比率} - \text{のれん相当額の償却額}'
        note: '同額だけ投資勘定（投資有価証券）を増減させます。関連会社からの配当金は、受取配当金を取り消して投資有価証券を減らします（投資損益にはしません）。ダウンストリームの未実現利益は投資会社の持分相当額だけ消去し、相手勘定は売上高（または持分法による投資損益）と投資有価証券です。のれん相当額は区分して表示せず、投資勘定に含めます。'
      - name: 在外子会社の換算と為替換算調整勘定
        tex: '\begin{aligned}\text{為替換算調整勘定} = {}& \text{純資産（外貨）} \times CR \\ & - (\text{支配獲得時の資本} \times HR + \text{取得後の利益剰余金の円換算額})\end{aligned}'
        note: '資産・負債は決算時の相場 $CR$、支配獲得時の資本は支配獲得時の相場 $HR$、取得後に生じた利益剰余金は発生時の相場（当期純利益は原則 $AR$、配当金は決議時の相場）で換算し、貸借の差額が為替換算調整勘定です。そのうち非支配株主の持分比率に相当する額は、非支配株主持分に振り替えます。のれんは外貨で計算して $CR$ で換算し、償却額は $AR$ で換算します。'

  - title: 総合原価計算と標準原価計算
    topics: [process-costing, standard-costing]
    items:
      - name: 配合差異
        tex: '\text{配合差異} = \sum_{i}\text{標準価格}_i \times (\text{実際総投入量} \times \text{標準配合割合}_i - \text{実際投入量}_i)'
        note: '複数の原料を混ぜて投入する工程で、数量差異を配合差異と歩留差異に分けます。実際の投入総量を標準の配合割合で分けた量と、各原料の実際投入量との差が配合差異です。価格差異は、原料ごとに「（標準価格 − 実際価格）× 実際投入量」で別に計算します。'
        term: standard-costing
      - name: 歩留差異
        tex: '\begin{aligned}\text{歩留差異} &= \sum_{i}\text{標準価格}_i \times (\text{標準消費量}_i - \text{実際総投入量} \times \text{標準配合割合}_i) \\ &= \text{平均標準単価} \times (\text{標準総投入量} - \text{実際総投入量})\end{aligned}'
        note: '標準総投入量は、実際の産出量から標準の歩留率で逆算した投入量で、これを標準配合割合で分けたものが各原料の標準消費量です。平均標準単価は、標準配合割合で加重平均した標準価格です。配合差異と歩留差異の合計は数量差異に一致します。'
      - name: 正常仕損費の負担（非度外視法）
        tex: '\text{月末仕掛品への配分額} = \text{正常仕損費} \times \frac{\text{月末仕掛品数量}}{\text{完成品数量} + \text{月末仕掛品数量}}'
        note: '仕損品の原価をいったん計算し（評価額を控除）、正常仕損費として良品に負担させる方法です。月末仕掛品が仕損の発生点を**通過していれば**完成品と月末仕掛品の両者に、通過していなければ完成品だけに負担させます。按分の基準（数量か換算量か）は問題文の指示に従います。異常仕損費は製品原価に含めず、非原価項目（営業外費用・特別損失）とします。'
        term: process-costing
      - name: 連産品の連結原価の配分
        tex: '\text{各連産品への配分額} = \text{連結原価} \times \frac{\text{正常市価} \times \text{生産量} - \text{分離後の見積加工費}}{\sum(\text{正常市価} \times \text{生産量} - \text{分離後の見積加工費})}'
        note: '分離点の後で追加加工する連産品は、最終製品の見積売価から分離後の加工費を差し引いた額の比で配分します（修正正常市価基準）。追加加工がなければ「正常市価 × 生産量」の比です。副産物は連結原価を配分せず、見積売却価額から加工費・販売費などを控除した額を主産物の原価から差し引きます。'

  - title: 直接原価計算・CVP分析・原価予測
    topics: [direct-costing-cvp]
    items:
      - name: 経営レバレッジ係数
        tex: '\begin{aligned}\text{経営レバレッジ係数} &= \frac{\text{貢献利益}}{\text{営業利益}} = \frac{1}{\text{安全余裕率}} \\ \text{営業利益の変化率} &= \text{経営レバレッジ係数} \times \text{売上高の変化率}\end{aligned}'
        note: '固定費の割合が高く、損益分岐点に近いほど係数は大きくなり、売上高の変動に対して利益が大きく振れます。係数は現在の売上高の水準で計算した値なので、売上高が変われば係数も変わります。'
        term: cvp-analysis
      - name: 多品種のCVP分析（セールス・ミックス一定）
        tex: '\text{損益分岐点売上高} = \frac{\text{固定費}}{\sum_{i}\text{売上高構成比}_i \times \text{貢献利益率}_i}'
        note: '売上高の構成比が一定と仮定した式です。販売量の比（セット販売）で与えられたときは、1セット当たりの貢献利益で固定費を割ってセット数を求め、各製品の数量に戻します。売上高構成比と販売量構成比を取り違えないようにします。'
      - name: 最小自乗法による原価の推定
        tex: 'b = \frac{n\sum xy - \sum x\sum y}{n\sum x^2 - \left(\sum x\right)^2},\qquad a = \frac{\sum y - b\sum x}{n}'
        note: '原価 $y = a + bx$（$a$ は固定費、$b$ は変動費率、$x$ は操業度）を、すべてのデータから推定します。正規方程式 $\sum y = na + b\sum x$、$\sum xy = a\sum x + b\sum x^2$ を連立して解いても同じ結果です。高低点法は2点しか使わないので、異常値の影響を受けやすくなります。'

  - title: 意思決定
    topics: [decision-making]
    items:
      - name: 正味現在価値法
        tex: '\mathrm{NPV} = \sum_{t=1}^{n}\frac{CF_t}{(1+r)^t} - I_0'
        note: '$I_0$ は投資額、$r$ は資本コストです。NPV ＞ 0 なら採用し、相互に排他的な案では NPV の大きい案を選びます。$CF_t$ は会計上の利益ではなく、税金の影響を含めた**キャッシュ・フロー**です。最終年度の設備の売却収入（税効果を含む）や運転資本の回収を加え忘れないようにします。'
      - name: 内部利益率法
        tex: '\sum_{t=1}^{n}\frac{CF_t}{(1+\mathrm{IRR})^t} - I_0 = 0'
        note: 'NPV をゼロにする割引率で、IRR ＞ 資本コストなら採用します。毎年の CF が一定なら「年金現価係数 ＝ $I_0$ ÷ 年間 CF」となる利率を係数表で探し、前後の2つの利率の間を直線補間します。規模の異なる相互排他的な案では IRR と NPV の順位が食い違うことがあり、その場合は NPV を優先します。'
      - name: 回収期間法
        tex: '\text{回収期間} = \frac{I_0}{\text{毎年の CF}}\quad (\text{毎年の CF が一定のとき})'
        note: '毎年の CF が異なるときは、累積 CF が投資額に達するまでの年数を求め、最後の年は年内で均等に発生すると仮定して按分します。貨幣の時間価値と回収後の CF を考慮しないのが欠点で、各年の CF を割り引いてから累積する割引回収期間法もあります。'
      - name: 税引後キャッシュ・フロー
        tex: '\text{税引後 CF} = (\text{現金収入} - \text{現金支出}) \times (1 - t) + \text{減価償却費} \times t'
        note: '$t$ は法人税等の税率です。減価償却費は現金支出を伴いませんが、課税所得を減らすので「減価償却費 × 税率」だけ税金が減ります（タックス・シールド）。設備を売却したときの CF は「売却価額 ＋（帳簿価額 − 売却価額）× 税率」で、売却損なら節税額が加わり、売却益なら税金の分だけ減ります。'
      - name: 差額原価収益分析
        tex: '\text{差額利益} = \text{差額収益} - \text{差額原価}'
        note: '代替案の間で金額が変わる収益・原価だけを比べます。過去に支出済みで将来の選択によって変わらない埋没原価（既存設備の取得原価など）は含めず、選ばなかった案から得られたはずの利益（機会原価）は原価に含めます。遊休生産能力の範囲で追加注文を受けるなら、固定費は差額原価になりません。'
      - name: 制約条件のもとでの製品の優先順位
        tex: '\text{優先順位の基準} = \frac{\text{製品1単位当たりの貢献利益}}{\text{製品1単位当たりの制約資源の消費量}}'
        note: '機械時間などの資源が1つだけ制約になるときは、製品1単位当たりではなく**制約資源1単位当たり**の貢献利益が大きい製品から、需要の上限まで生産します。制約が2つ以上あるときは、線形計画法（実行可能領域の端点の比較）で解きます。'

  - title: 戦略的原価計算
    topics: [strategic-cost-management]
    items:
      - name: 活動基準原価計算（ABC）
        tex: '\text{活動ドライバー率} = \frac{\text{活動のコスト・プール}}{\text{コスト・ドライバーの総数}},\qquad \text{製品への割当額} = \sum_{\text{活動}}\text{活動ドライバー率} \times \text{製品の消費量}'
        note: '製造間接費を活動ごとに集計し、段取回数・検査回数・部品点数などの活動の消費量で製品に割り当てます。直接作業時間などの操業度だけで配賦する伝統的な方法に比べ、少量多品種の製品の原価が高く計算される傾向があります。'
      - name: 品質原価（PAF 法）
        tex: '\text{品質原価} = \underbrace{\text{予防原価} + \text{評価原価}}_{\text{品質適合コスト}} + \underbrace{\text{内部失敗原価} + \text{外部失敗原価}}_{\text{品質不適合コスト}}'
        note: '品質教育・設計改善は予防原価、受入検査・製品検査は評価原価、仕損・手直しは内部失敗原価、クレーム処理・返品・製品回収は外部失敗原価です。検査は予防原価ではなく評価原価に入ります。予防・評価原価を増やすと失敗原価が減るというトレードオフの関係があります。'
      - name: 原価企画の許容原価
        tex: '\text{許容原価} = \text{予定販売価格} - \text{目標利益}'
        note: '市場で受け入れられる価格から目標利益を差し引いた許容原価と、現状の技術で見積もった成行原価をすり合わせて目標原価を決め、設計段階で原価を作り込みます。原価に利益を上乗せして価格を決める考え方とは逆の順序です。'
