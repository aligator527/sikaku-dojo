name: 日商簿記検定1級
shortName: 簿記1級
family: boki
category: accounting
level: 1級
order: 52
status: published
summary: 極めて高度な商業簿記・会計学・工業簿記・原価計算を修得し、会計基準や会社法などの法規を踏まえて経営管理・経営分析ができるかを問う試験。合格すると税理士試験の受験資格が得られる。
organizer:
  name: 日本商工会議所・各地商工会議所
  url: https://www.kentei.ne.jp/bookkeeping
format:
  short: ペーパー・90分×2回（4科目）
  method: 統一試験（ペーパー）のみ
  duration: 180分（商業簿記・会計学90分、工業簿記・原価計算90分。途中に休憩あり）
  questions: 商業簿記・会計学・工業簿記・原価計算の4科目
  answerStyle: 答案用紙に計算結果・仕訳・財務諸表・語句などを記入
  passing: 4科目の合計得点が70%以上、かつ1科目ごとの得点が40%以上
  schedule: 年2回（6月・11月）の統一試験
  notes:
    - 各科目25点満点・合計100点（大手予備校の公表値）。1科目でも40%（10点）に届かないと合計点にかかわらず不合格になる
    - 前半（商業簿記・会計学）のみ、後半（工業簿記・原価計算）のみの受験はできない
    - 第158回（2021年6月）以降の1級の試験問題が日本商工会議所のWebサイトで公開されている（無断転載・営利目的の使用は禁止）
    - 2027年度の試験から新しい出題区分表が適用され、リースではサブリース取引・借地権の処理、会計処理では期中財務諸表、純資産では株式引受権などが明記された。工業簿記・原価計算の区分は変更されない
    - 会計基準・法令は毎年度4月1日現在施行されているものに準拠し、早期適用は出題の対象に含めない
choiceStyle: katakana
sections:
  - id: shogyo
    name: 商業簿記
    description: 前半90分（会計学と合わせて）。個別財務諸表・連結財務諸表の作成、本支店会計などの総合問題。
  - id: kaikeigaku
    name: 会計学
    description: 前半90分（商業簿記と合わせて）。会計基準の理論（正誤・語句）と個別論点の計算。
  - id: kogyo
    name: 工業簿記
    description: 後半90分（原価計算と合わせて）。勘定記入を伴う原価計算の総合問題。
  - id: genka
    name: 原価計算
    description: 後半90分（工業簿記と合わせて）。意思決定会計・業績管理・戦略的原価計算などの計算と理論。
topics:
  - id: financial-instruments
    name: 金融商品会計・外貨換算会計（有価証券・債権・デリバティブ・ヘッジ）
    group: 商業簿記・会計学
  - id: revenue-recognition
    name: 収益認識（工事契約・変動対価・本人と代理人など）
    group: 商業簿記・会計学
  - id: fixed-assets-impairment
    name: 固定資産・減損会計・資産除去債務
    group: 商業簿記・会計学
  - id: lease
    name: リース会計（借手・貸手、セール・アンド・リースバック、サブリース）
    group: 商業簿記・会計学
  - id: retirement-benefits
    name: 退職給付会計と引当金
    group: 商業簿記・会計学
  - id: tax-effect
    name: 税効果会計・法人税等
    group: 商業簿記・会計学
  - id: equity-business-combination
    name: 純資産会計・企業結合・事業分離
    group: 商業簿記・会計学
  - id: consolidation
    name: 連結会計・持分法・在外子会社
    group: 商業簿記・会計学
  - id: accounting-theory
    name: 会計基準と概念フレームワーク（理論）
    group: 商業簿記・会計学
  - id: cost-accounting-basics
    name: 費目別・部門別・個別原価計算
    group: 工業簿記・原価計算
  - id: process-costing
    name: 総合原価計算（工程別・仕損減損・副産物・連産品）
    group: 工業簿記・原価計算
  - id: standard-costing
    name: 標準原価計算（配合差異・歩留差異を含む）
    group: 工業簿記・原価計算
  - id: direct-costing-cvp
    name: 直接原価計算・CVP分析・原価予測
    group: 工業簿記・原価計算
  - id: decision-making
    name: 差額原価収益分析・設備投資の意思決定
    group: 工業簿記・原価計算
  - id: strategic-cost-management
    name: 戦略的原価計算（活動基準原価計算・原価企画・品質原価計算・ライフサイクル・コスティング）
    group: 工業簿記・原価計算
