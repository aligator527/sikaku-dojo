title: 中小企業診断士・経営
items:
  - title: 中小企業診断士試験
    url: https://www.jf-cmca.jp/contents/007_shiken.html
    publisher: 一般社団法人 日本中小企業診断士協会連合会
    lang: ja
    kind: official
    cost: free
    exams: [shindanshi]
