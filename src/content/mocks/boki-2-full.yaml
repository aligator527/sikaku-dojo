exam: boki-2
title: 2級 ネット試験形式模試（90分）
description: ネット試験と同じ 90分・100点満点で、第1問の仕訳5題（各4点）、第2問の株主資本等変動計算書・連結・勘定記入などの表（20点）、第3問の財務諸表・本支店会計などの作成（20点）、第4問の工業簿記の仕訳3題（各4点）と勘定記入・製造原価報告書などの表（16点）、第5問の標準原価計算・直接原価計算の表（12点）を出題します。表の問題は欄ごとの部分点です。2027年度からの出題区分表（リースは使用権資産・リース負債、手形の論点は削除）に合わせた問題で、合格ラインは本試験と同じ 70% です。
