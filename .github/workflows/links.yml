name: Check external links

# Resource lists and official links rot over time; check them weekly.
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 4 --timeout 30 --max-retries 2
            --accept 200..=299,403,429
            'src/content/**/*.yaml' 'src/content/**/*.md'
          output: lychee-report.md
          fail: false
      - name: Open an issue when links are broken
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "外部リンク切れの報告（自動）" --body-file lychee-report.md --label links
