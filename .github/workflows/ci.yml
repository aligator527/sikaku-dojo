name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Content lint (KaTeX, YAML, answer keys)
        run: pnpm validate --quiet
      - name: Unit tests
        run: pnpm test
      - name: Type check
        run: pnpm check
      - name: Build (validates all content)
        run: pnpm build
